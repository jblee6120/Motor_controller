requirements:
- id: STK-REQ-001
  title: 자체 HW/SW 소유
  need: 개발자는 moteus c1을 참조하되 자체 설계한 모터제어 보드와 관리 가능한 펌웨어를 확보하고자 한다.
  stakeholder: STK-OWNER
  priority: Must
  status: Proposed
  rationale: 사용자 제공 개발 컨셉에 기반한 제안
  acceptance_of_stakeholder: TBD
- id: STK-REQ-002
  title: 3상 모터 구동
  need: 사용자는 하나의 3상 PMSM/BLDC 모터를 구동하고자 한다.
  stakeholder: STK-OWNER
  priority: Must
  status: Proposed
  rationale: 사용자 제공 개발 컨셉에 기반한 제안
  acceptance_of_stakeholder: TBD
- id: STK-REQ-003
  title: 센서 기반 FOC
  need: 사용자는 모터 위치/각도 피드백을 사용한 FOC를 구현하고자 한다.
  stakeholder: STK-OWNER
  priority: Must
  status: Proposed
  rationale: 사용자 제공 개발 컨셉에 기반한 제안
  acceptance_of_stakeholder: TBD
- id: STK-REQ-004
  title: 전류 제어
  need: 사용자는 모터 전류 명령에 따른 폐루프 제어를 원한다.
  stakeholder: STK-OWNER
  priority: Must
  status: Proposed
  rationale: 사용자 제공 개발 컨셉에 기반한 제안
  acceptance_of_stakeholder: TBD
- id: STK-REQ-005
  title: 속도 제어
  need: 사용자는 목표 회전속도를 추종하는 운전 모드를 원한다.
  stakeholder: STK-OWNER
  priority: Must
  status: Proposed
